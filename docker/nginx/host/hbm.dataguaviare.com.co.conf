# Nginx del SERVIDOR (host), no el contenedor hbm_nginx.
# Instalación típica en Ubuntu:
#   sudo cp docker/nginx/host/hbm.dataguaviare.com.co.conf /etc/nginx/sites-available/hbm.dataguaviare.com.co
#   sudo ln -sf /etc/nginx/sites-available/hbm.dataguaviare.com.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d hbm.dataguaviare.com.co
#
# Requiere los contenedores HBM con puertos publicados (por defecto en .env.docker.example):
#   HBM_NGINX_HOST_PORT=18080  HBM_VITE_HOST_PORT=5173

server {
    listen 80;
    listen [::]:80;
    server_name hbm.dataguaviare.com.co;

    access_log /var/log/nginx/hbm.access.log;
    error_log  /var/log/nginx/hbm.error.log;

    client_max_body_size 16M;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location ^~ /api {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
