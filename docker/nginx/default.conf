server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Importación de catálogo (Excel/CSV) y subidas; el default 1m de nginx corta el body.
    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Activar HSTS solo si el sitio sirve exclusivamente HTTPS en producción:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear acceso directo a subdirectorios privados de storage que no pertenecen al webroot público
    location ~ ^/storage/app/ {
        deny all;
    }
    location ~ ^/storage/(framework|logs)/ {
        deny all;
    }
}
