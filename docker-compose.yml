# Desarrollo: backend + MySQL + Nginx + Adminer. El frontend (Vite) corre en el host: `cd frontend && npm run dev`.
# Build de producción del SPA: `cd frontend && npm run build` (servir estáticos con Nginx o CDN cuando corresponda).
#
# Base de datos: el volumen `mysql_data` conserva MySQL entre reinicios de contenedores.
# NO uses `docker compose down -v` (la opción -v elimina volúmenes y borra todos los datos).
# Para esquema: `php artisan migrate` (solo aplica migraciones pendientes; no borra filas).
# Evita en datos reales: `migrate:fresh`, `migrate:refresh`, `db:wipe` (destruyen o vacían tablas).
#
# PDF / Blade: vistas compiladas en /tmp/laravel-views (Dockerfile inyecta PHP-FPM env[VIEW_COMPILED_PATH]).
# Tras cambiar Dockerfile o entrypoint: `docker compose build laravel && docker compose up -d`
# Si `bootstrap/cache/config.php` se generó fuera del contenedor y falla, dentro del contenedor: `php artisan config:clear`
# Otras escrituras en storage: `docker compose exec -u root laravel chmod -R 777 storage bootstrap/cache`
services:
  mysql:
    image: mysql:8.0
    container_name: hbm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hbm_facturador
      MYSQL_USER: hbm
      MYSQL_PASSWORD: hbm_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hbm_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hbm_facturador
      DB_USERNAME: hbm
      DB_PASSWORD: hbm_secret

  nginx:
    image: nginx:alpine
    container_name: hbm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel


  adminer:
    image: adminer:latest
    container_name: hbm_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
