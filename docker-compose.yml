# Puertos del host: valores por defecto abajo; para sobreescribir, copia `.env.docker.example` → `.env` en esta carpeta.
services:
  mysql:
    image: mysql:8.0
    container_name: hbm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hbm_facturador
      MYSQL_USER: hbm
      MYSQL_PASSWORD: hbm_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${HBM_MYSQL_HOST_PORT:-13306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hbm_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    # Evita 502 al arrancar: nginx no debe enrutar hasta que php-fpm escuche en :9000
    # (el entrypoint corre migrate/seed antes de `exec php-fpm`).
    healthcheck:
      # En Compose, $$ → $ literal (evita que $fp se interprete como env).
      test:
        [
          'CMD',
          'php',
          '-r',
          '$$fp=@fsockopen("127.0.0.1",9000);if($$fp)fclose($$fp);exit($$fp?0:1);',
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 120s
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hbm_facturador
      DB_USERNAME: hbm
      DB_PASSWORD: hbm_secret
      HBM_AUTO_DB_SYNC: "true"
      # FQCN con barras simples (YAML). En producción suele omitirse (seeder vía `php artisan db:seed`).
      HBM_AUTO_SEED_CLASS: 'Database\Seeders\EnsureDevLoginSeeder'

  nginx:
    image: nginx:alpine
    container_name: hbm_nginx
    restart: unless-stopped
    ports:
      - "${HBM_NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      laravel:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: hbm_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${HBM_VITE_HOST_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://nginx
      CHOKIDAR_USEPOLLING: "true"
      # Tras Nginx público (puerto 80/443), definir en `.env` raíz — ver .env.docker.example
      VITE_HMR_EXTERNAL_HOST: ${VITE_HMR_EXTERNAL_HOST:-}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - nginx

  adminer:
    image: adminer:latest
    container_name: hbm_adminer
    restart: unless-stopped
    ports:
      - "${HBM_ADMINER_HOST_PORT:-8082}:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  frontend_node_modules:
