services:
  mysql:
    image: mysql:8.0
    container_name: hbm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hbm_facturador
      MYSQL_USER: hbm
      MYSQL_PASSWORD: hbm_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hbm_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hbm_facturador
      DB_USERNAME: hbm
      DB_PASSWORD: hbm_secret

  nginx:
    image: nginx:alpine
    container_name: hbm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel

  frontend:
    image: node:20-alpine
    container_name: hbm_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      # Vacío: el navegador llama a /api en el mismo origen (5173) y Vite reenvía a nginx.
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://nginx

  adminer:
    image: adminer:latest
    container_name: hbm_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
